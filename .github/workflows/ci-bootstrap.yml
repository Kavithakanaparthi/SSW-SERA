name: SSW-SERA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      evidence_environment:
        description: Release evidence environment
        required: false
        default: CI
        type: choice
        options:
          - CI
          - STAGING

permissions:
  contents: read

concurrency:
  group: ssw-sera-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22 build and verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ssw
          POSTGRES_PASSWORD: ssw_ci
          POSTGRES_DB: ssw_sera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ssw -d ssw_sera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ssw:ssw_ci@127.0.0.1:5432/ssw_sera
      RELEASE_EVIDENCE_ENVIRONMENT: ${{ inputs.evidence_environment || 'CI' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Toolchain versions
        run: |
          node --version
          npm --version

      - name: Clean install from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate

      - name: Verify scaffold
        run: npm run verify:scaffold

      - name: Verify contracts
        run: npm run verify:contracts

      - name: Run contract, integration and security tests
        shell: bash
        run: |
          mkdir -p .artifacts
          set -o pipefail
          npm test | tee .artifacts/test-output.log

      - name: Strict TypeScript check
        run: npm run typecheck

      - name: Generate hashed release evidence
        run: npm run release:evidence

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: ssw-sera-release-evidence-${{ github.run_id }}
          path: .artifacts/release-evidence.json
          if-no-files-found: error
          retention-days: 30
