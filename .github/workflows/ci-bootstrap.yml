name: SSW-SERA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssw-sera-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22 build and verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Toolchain versions
        run: |
          node --version
          npm --version

      - name: Clean install from committed lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify scaffold
        run: npm run verify:scaffold

      - name: Verify contracts
        run: npm run verify:contracts

      - name: Run contract, integration and security tests
        run: npm test

      - name: Strict TypeScript check
        run: npm run typecheck
