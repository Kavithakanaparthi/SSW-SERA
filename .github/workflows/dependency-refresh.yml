name: SSW-SERA Dependency Refresh

on:
  push:
    branches: [main]
    paths:
      - package.json
      - packages/**/package.json
      - services/**/package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssw-sera-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ssw
          POSTGRES_PASSWORD: ssw_ci
          POSTGRES_DB: ssw_sera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ssw -d ssw_sera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ssw:ssw_ci@127.0.0.1:5432/ssw_sera
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Resolve lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Migrate PostgreSQL
        run: npm run db:migrate
      - name: Verify repository
        run: npm run ci:verify
      - name: Commit verified lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh verified npm lockfile for PROD-03"
          git push
